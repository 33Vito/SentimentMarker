name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # README Tests commands, including the full six-edition rebuild (no skip).
      - run: node test/core.test.js
      - run: node test/diff.test.js
      - run: node test/diff-ui.test.js
      - run: node tools/build-lexicon.js --check
      - name: Check finance vocabulary against upstream lexicons
        run: |
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT
          curl -fsSL -o "$TMPDIR/pysentiment2.whl" \
            https://files.pythonhosted.org/packages/d1/7c/596f3028260310d6206b7b88fe7d37fdb367913bfac9195912b27ab3cadb/pysentiment2-0.1.1-py3-none-any.whl
          curl -fsSL -o "$TMPDIR/vaderSentiment.whl" \
            https://files.pythonhosted.org/packages/76/fc/310e16254683c1ed35eeb97386986d6c00bc29df17ce280aed64d55537e9/vaderSentiment-3.3.2-py2.py3-none-any.whl
          printf '%s  %s\n' \
            "d0ff7a0b702654baeff6a6bec231e56ba4c4c9bc9ad4730856e8ca69335450c7" "$TMPDIR/pysentiment2.whl" \
            "3bf1d243b98b1afad575b9f22bc2cb1e212b94ff89ca74f8a23a588d024ea311" "$TMPDIR/vaderSentiment.whl" \
            | sha256sum -c -
          unzip -oq "$TMPDIR/pysentiment2.whl" pysentiment2/static/LM.csv -d "$TMPDIR"
          unzip -oq "$TMPDIR/vaderSentiment.whl" vaderSentiment/vader_lexicon.txt -d "$TMPDIR"
          node tools/build-finance-vocab.js --check \
            --lm "$TMPDIR/pysentiment2/static/LM.csv" \
            --vader "$TMPDIR/vaderSentiment/vader_lexicon.txt"
