<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SentimentMarker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..700&family=Literata:opsz,wght@7..72,400..700&display=swap">
<style>
/* Layout concept: grey desk, one white page in the middle, a thin toolbar on top,
   a heat strip (minimap) along the right edge. Marker colours: orange = negative, teal = positive. */
:root{
  --bg:#e8eaee; --paper:#fbfbfc; --ink:#1c2128; --muted:#5d6672; --line:#d5d9e0;
  --chip:#eceef2; --chip-on:#1c2128; --chip-on-ink:#fbfbfc;
  --pos:#14a596; --neg:#f2802b; --a-min:.15; --a-max:.74; --focus:#3d6ee0;
  --shadow:0 1px 2px rgba(20,24,30,.06),0 10px 32px rgba(20,24,30,.08);
  --font-read:'Literata','Noto Serif SC','Songti SC','Source Han Serif SC',Georgia,serif;
  --font-ui:'DM Sans','PingFang SC','Noto Sans SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --font-num:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --bar-h:120px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --paper:#181c22; --ink:#e9ecf0; --muted:#98a2af; --line:#2a313a;
    --chip:#222831; --chip-on:#e9ecf0; --chip-on-ink:#14181d;
    --pos:#1fb5a5; --neg:#f08c3f; --a-min:.14; --a-max:.52; --focus:#8fb0ff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --paper:#181c22; --ink:#e9ecf0; --muted:#98a2af; --line:#2a313a;
  --chip:#222831; --chip-on:#e9ecf0; --chip-on-ink:#14181d;
  --pos:#1fb5a5; --neg:#f08c3f; --a-min:.14; --a-max:.52; --focus:#8fb0ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  padding-block:0 5rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pos{--hue:var(--pos)} .neg{--hue:var(--neg)}
.chip.pos::before,.chip.neg::before{content:"";width:.5rem;height:.5rem;border-radius:99px;background:var(--hue);flex:none}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:grid;gap:.6rem;padding-block:.75rem .65rem;max-width:60rem;margin-inline:auto;border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--line)}
.row{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;min-width:0}
.top{justify-content:space-between;flex-wrap:nowrap}
.brand{font:650 1rem/1 var(--font-ui);letter-spacing:-.01em;white-space:nowrap}
.brand em{font-style:normal;padding:.08em .22em;margin-left:.04em;border-radius:.25em;
  background-image:linear-gradient(103deg,color-mix(in srgb,var(--neg) 55%,transparent) 0,color-mix(in srgb,var(--neg) 55%,transparent) 48%,color-mix(in srgb,var(--pos) 55%,transparent) 52%,color-mix(in srgb,var(--pos) 55%,transparent) 100%)}
.actions{display:flex;gap:.4rem}
.btn{font:500 .8125rem/1 var(--font-ui);padding:.55rem .85rem;border-radius:.6rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
.btn.solid{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.seg{display:inline-flex;padding:3px;background:var(--chip);border-radius:.7rem;gap:2px}
.seg button{border:0;background:transparent;padding:.42rem .95rem;border-radius:.5rem;font:500 .875rem/1 var(--font-ui);color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.legend{display:inline-flex;align-items:center;gap:.45rem;font:500 .75rem var(--font-ui);color:var(--muted)}
.ramp{width:5.5rem;height:.55rem;border-radius:99px;border:1px solid var(--line);
  background:linear-gradient(90deg,color-mix(in srgb,var(--neg) 80%,transparent),transparent 50%,color-mix(in srgb,var(--pos) 80%,transparent))}
.slider{display:flex;align-items:center;gap:.55rem;font:500 .75rem var(--font-ui);color:var(--muted);flex:1 1 11rem;min-width:0}
.slider input{flex:1;min-width:5rem;accent-color:var(--ink)}
.slider output{font:400 .75rem var(--font-num);min-width:2.6em;text-align:right;color:var(--ink)}
.topics{display:flex;align-items:center;gap:.45rem;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.topics::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .75rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);font:500 .8125rem/1 var(--font-ui);white-space:nowrap;flex:none}
.chip small{font:400 .7rem var(--font-num);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.chip .rm{opacity:.6;margin-right:-.2rem;padding:0 .15rem}
/* topic chip + its ▾ (strongest passages); the mean rides in the chip: a dot (hue = sign, depth = strength) and the value */
.tg{display:inline-flex;flex:none}
.tg>.chip:first-child{border-top-right-radius:0;border-bottom-right-radius:0;padding-right:.6rem}
.tg>.more{border-top-left-radius:0;border-bottom-left-radius:0;border-left:0;padding:.4rem .5rem;font-size:.7rem;color:var(--muted)}
.tg>.more[aria-expanded="true"]{background:var(--chip);color:var(--ink)}
.chip .tmean{display:inline-flex;align-items:center;gap:.25rem;font:400 .7rem var(--font-num);color:var(--muted)}
.chip .tmean i{width:.5rem;height:.5rem;border-radius:99px;background:color-mix(in srgb,var(--hue,var(--line)) calc((.35 + var(--k,0) * .65) * 100%),transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hue,var(--muted)) 40%,transparent)}
.chip[aria-pressed="true"] .tmean{color:inherit;opacity:.8}
.kw{flex:0 0 8.5rem;border:1px dashed var(--line);background:transparent;border-radius:999px;padding:.4rem .75rem;font:500 .8125rem/1 var(--font-ui)}
.kw::placeholder{color:var(--muted)}
.match{font:400 .75rem var(--font-num);color:var(--muted);flex:none;padding-left:.3rem}
.lbl{font:500 .75rem var(--font-ui);color:var(--muted);flex:none;margin-right:.1rem}
.only-m{display:none}

/* page */
.stage{display:block}
.sheet{max-width:44rem;margin:.6rem auto 0;background:var(--paper);border-radius:1rem;box-shadow:var(--shadow);padding:clamp(1.4rem,4.5vw,3rem) clamp(1.3rem,5vw,3.4rem) clamp(2rem,5vw,3.6rem)}
.dochead{margin-bottom:1.6rem;padding-bottom:1.3rem;border-bottom:1px solid var(--line)}
.src{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:0 0 .6rem;font:400 .75rem var(--font-num);color:var(--muted);overflow-wrap:anywhere}
.badge{white-space:nowrap;font:500 .68rem var(--font-ui);letter-spacing:.04em;padding:.18rem .45rem;border-radius:.3rem;background:var(--chip);color:var(--ink)}
.dochead h1{margin:0;font:650 clamp(1.6rem,4.6vw,2.15rem)/1.15 var(--font-ui);letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.meta{margin:.7rem 0 .9rem;font:400 .8125rem var(--font-ui);color:var(--muted)}
.dist{display:flex;height:.5rem;border-radius:99px;overflow:hidden;gap:2px;background:transparent}
.dist i{display:block;min-width:2px}
.dist .neg{background:color-mix(in srgb,var(--neg) 75%,transparent)}
.dist .neu{background:var(--line)}
.dist .pos{background:color-mix(in srgb,var(--pos) 75%,transparent)}
.dlg{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin:.5rem 0 0;font:400 .75rem var(--font-num);color:var(--muted)}

.doc{font-family:var(--font-read);font-size:1.0625rem;line-height:1.85;color:var(--ink);overflow-wrap:break-word;hyphens:auto}
.blk{margin:0 -.8rem 1.1rem;padding:.3rem .8rem;border-radius:.6rem;transition:background-color .2s,opacity .2s,box-shadow .2s;scroll-margin-top:calc(var(--bar-h) + 18px)}
.blk.hd{margin-top:2.1rem;margin-bottom:.4rem;font:650 1.25rem/1.4 var(--font-ui);letter-spacing:-.01em;text-wrap:balance}
.blk.hd:first-child{margin-top:0}
.s,.w{transition:opacity .2s}
.s{cursor:default}
.s.dim{opacity:.3}
.blk.blkdim{opacity:.26}
.s.sel,.blk.sel{outline:1.5px solid color-mix(in srgb,var(--ink) 55%,transparent);outline-offset:2px;border-radius:.3em}
.blk.sel{border-radius:.6rem}

/* the marker */
.lv-word .w.on,.lv-sent .s.on{
  --hl:color-mix(in srgb,var(--hue) calc((var(--a-min) + var(--k) * (var(--a-max) - var(--a-min))) * 100%),transparent);
  background-image:linear-gradient(103deg,transparent 0,var(--hl) 1.6%,var(--hl) 97%,transparent 100%);
  background-repeat:no-repeat;background-size:100% 92%;background-position:0 58%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  border-radius:.3em;padding:.05em .18em;margin:0 -.18em;
}
.lv-para .blk.on{
  --hl:color-mix(in srgb,var(--hue) calc((var(--a-min) * .7 + var(--k) * (var(--a-max) - var(--a-min)) * .55) * 100%),transparent);
  background-color:var(--hl);
  box-shadow:inset 3px 0 0 color-mix(in srgb,var(--hue) 85%,transparent);
}
.lv-sent .s,.lv-para .blk{cursor:pointer}
.lv-word .w{cursor:pointer}
@media (hover:hover){
  .lv-sent .s:hover,.lv-word .w:hover{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);text-underline-offset:.22em}
  .lv-para .blk:hover{background-color:color-mix(in srgb,var(--ink) 4%,transparent)}
  .lv-para .blk.on:hover{background-color:var(--hl)}
}

/* heat strip */
.mm{position:fixed;z-index:20;right:max(3px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:14px;touch-action:none;cursor:pointer}
.mm canvas{display:block;width:100%;height:100%}
.vp{position:absolute;left:-1px;right:-1px;border:1.5px solid color-mix(in srgb,var(--ink) 65%,transparent);border-radius:3px;background:color-mix(in srgb,var(--ink) 7%,transparent);pointer-events:none}

/* inspector */
.insp{position:fixed;z-index:35;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));margin-inline:auto;max-width:42rem;
  bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);
  padding:.85rem 1rem 1rem;max-height:min(46vh,24rem);overflow:auto;font-family:var(--font-ui)}
/* spectrum panel: bottom sheet when narrow, left rail when wide (inspector takes the right) */
.spec{position:fixed;z-index:34;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));margin-inline:auto;max-width:42rem;
  bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);
  padding:.85rem 1rem 1rem;max-height:min(62vh,30rem);overflow:auto;font-family:var(--font-ui)}
.spec .sub{margin:0 0 .6rem;font:400 .78rem/1.55 var(--font-ui);color:var(--muted)}
.spec .sumline{margin:.5rem 0 .2rem;font:400 .8rem/1.6 var(--font-ui);color:var(--ink)}
.spec .sumline b{font:600 .8rem var(--font-num)}
.spec h3{margin:1rem 0 .4rem;font:600 .78rem var(--font-ui);color:var(--muted);letter-spacing:.02em}
.spec svg{display:block;width:100%;height:auto;overflow:visible}
/* outline: bottom sheet like the spectrum when narrow, right rail when wide.
   It shares the rail with the inspector; when both are open the inspector docks under the outline (syncPanels). right stays >= 24px so the 14px heat strip keeps its margin. */
.toc{position:fixed;z-index:34;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));margin-inline:auto;max-width:42rem;
  bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--paper);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);
  padding:.85rem 1rem 1rem;max-height:min(62vh,30rem);overflow:auto;font-family:var(--font-ui)}
.toc h3{margin:.1rem 0 .3rem;font:600 .78rem var(--font-ui);color:var(--muted);letter-spacing:.02em}
.toc ol{list-style:none;margin:.25rem 0 0;padding:0;display:grid;gap:1px}
.toc li.lv2{padding-left:.9rem}
.toc .te{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.18rem .5rem;align-items:center;width:100%;text-align:left;border:0;background:transparent;
  padding:.32rem .45rem;border-radius:.45rem;cursor:pointer;font:inherit;color:inherit}
.toc .te:hover{background:var(--chip)}
.toc .te.on{background:var(--chip-on);color:var(--chip-on-ink)}
.toc .tt{font:500 .78rem/1.4 var(--font-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc li.lv2 .tt{font-weight:400}
.toc li.lv2 .te:not(.on) .tt{color:var(--muted)}
.toc .tv{font:600 .72rem var(--font-num);padding:.05rem .4rem;border-radius:.3rem;background:color-mix(in srgb,var(--hue) 30%,transparent);white-space:nowrap}
.toc .tb{grid-column:1/-1;height:3px;border-radius:2px;background:color-mix(in srgb,var(--hue) 85%,transparent)}
.toc .tb.n{justify-self:end}
/* topic overlay: with a topic selected each row shows its hits in that section and their mean */
.toc .tnote{margin:0 0 .3rem;font:400 .7rem/1.45 var(--font-ui);color:var(--muted)}
.toc .tv small{font:400 .66rem var(--font-num);opacity:.75}
.toc li.off .tt{opacity:.45}
/* topic popover: summary of one topic and its strongest passages, under the toolbar beside its chip */
.tpop{position:fixed;z-index:45;width:min(24rem,calc(100vw - 24px));max-height:calc(100vh - var(--bar-h) - 40px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);padding:.85rem 1rem 1rem;font-family:var(--font-ui)}
.tpop .ih b{font:600 .95rem var(--font-ui);overflow-wrap:anywhere}
.tpop .ctx{margin:0 0 .5rem}
.tpop h3{margin:.8rem 0 .35rem;font:600 .78rem var(--font-ui);color:var(--muted);letter-spacing:.02em}
.tql{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tql button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.6rem;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:.35rem .45rem;border-radius:.45rem;font:400 .82rem/1.5 var(--font-read)}
.tql button:hover{background:var(--chip)}
.tql .sc{font:500 .75rem var(--font-num);padding:.1rem .4rem;border-radius:.3rem;background:color-mix(in srgb,var(--hue) 30%,transparent);white-space:nowrap}
.sp-t{font:400 10px var(--font-num);fill:var(--muted)}
.sp-ax{stroke:var(--line);stroke-width:1}
.sp-zero{stroke:var(--ink);stroke-width:1;opacity:.35;stroke-dasharray:2 3}
.sp-mean{stroke:var(--ink);stroke-width:1.5}
.sp-ref{fill:color-mix(in srgb,var(--muted) 45%,transparent)}
.sp-neg{fill:color-mix(in srgb,var(--neg) 80%,transparent)}
.sp-pos{fill:color-mix(in srgb,var(--pos) 80%,transparent)}
.sp-mk{fill:var(--ink)}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.wl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 .6rem;align-items:baseline;padding:.3rem .45rem;border-radius:.45rem;cursor:pointer}
.wl li:hover{background:var(--chip)}
.wl .wt{font:500 .875rem var(--font-ui);overflow-wrap:anywhere}
.wl .wt small{font:400 .7rem var(--font-num);color:var(--muted)}
.wl .sc,.anch .sc{font:500 .78rem var(--font-num);padding:.1rem .4rem;border-radius:.3rem;background:color-mix(in srgb,var(--hue) 30%,transparent);white-space:nowrap}
.wl .rk{grid-column:1/-1;font:400 .72rem var(--font-ui);color:var(--muted)}
.wl li{grid-template-columns:minmax(0,1fr) auto}
.wl li.pos,.anch .an.pos{--hue:var(--pos)}
.wl li.neg,.anch .an.neg{--hue:var(--neg)}
.anch{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.anch>div{display:flex;flex-wrap:wrap;gap:.3rem;align-content:flex-start}
.anch .an{display:inline-flex;align-items:center;gap:.35rem;font:500 .78rem var(--font-ui)}
.exp{white-space:nowrap;margin-left:auto;display:inline-flex;gap:.6rem}
.lnk{border:0;background:transparent;padding:0;font:500 .72rem var(--font-ui);color:var(--muted);text-decoration:underline;text-underline-offset:.2em}
.lnk:hover{color:var(--ink)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
/* wide: two side rails beside the centred 44rem page. Rail width = the space left beside the page minus
   gutters, capped at 20rem (at 1360px: 680 - 352 - 48 = 280px, leaving >=16px to the page even with a scrollbar) */
@media (min-width:1360px){
  .spec{left:max(20px,env(safe-area-inset-left,0px));right:auto;margin:0;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 16px);bottom:auto;width:min(20rem,calc(50vw - 22rem - 48px));max-height:calc(100vh - var(--bar-h) - 48px)}
  .insp{left:auto;right:max(24px,env(safe-area-inset-right,0px));margin:0;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 16px);bottom:auto;width:min(20rem,calc(50vw - 22rem - 48px));max-height:calc(100vh - var(--bar-h) - 48px)}
  .toc{left:auto;right:max(24px,env(safe-area-inset-right,0px));margin:0;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 16px);bottom:auto;width:min(20rem,calc(50vw - 22rem - 48px));max-height:min(50vh,calc(100vh - var(--bar-h) - 48px))}
  body.spec-on .insp .mini{display:none}
}
.insp .mini{margin:.7rem 0 0;padding-top:.6rem;border-top:1px solid var(--line)}
.insp .mini svg{display:block;width:100%;height:auto;overflow:visible}
.insp .mini .ctx{margin:0 0 .3rem}
.drv{font:500 .68rem var(--font-ui);padding:.12rem .4rem;border-radius:.3rem;background:var(--chip);color:var(--muted)}
.warnl{margin:.5rem 0 .2rem;padding:.45rem .6rem;border-radius:.5rem;background:color-mix(in srgb,var(--neg) 12%,transparent);font:400 .76rem/1.55 var(--font-ui);color:var(--ink)}
.scl{margin:.45rem 0 0;font:400 .72rem/1.5 var(--font-ui);color:var(--muted)}
.scl b{font:500 .72rem var(--font-num);color:var(--ink)}
.ih{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.ik{font:500 .75rem var(--font-ui);color:var(--muted)}
.is{font:600 1.15rem var(--font-num)}
.is.pos{color:var(--ink)}
.x{margin-left:auto;border:0;background:var(--chip);width:1.9rem;height:1.9rem;border-radius:.5rem;font-size:1.1rem;line-height:1}
.itx{margin:0 0 .7rem;font:400 .9rem/1.6 var(--font-read);color:var(--ink)}
.cl{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.cl li{display:grid;grid-template-columns:minmax(0,auto) auto 1fr;gap:.2rem .6rem;align-items:baseline;padding:.3rem .45rem;border-radius:.45rem}
.cl li.hit{background:var(--chip)}
.cl .wt{font:500 .875rem var(--font-ui);overflow-wrap:anywhere}
.cl .sc,.cl .sn{font:500 .78rem var(--font-num);padding:.1rem .4rem;border-radius:.3rem;background:color-mix(in srgb,var(--hue) 30%,transparent);white-space:nowrap}
.cl .nt{font:400 .75rem var(--font-ui);color:var(--muted);min-width:0}
.cl.bl li{grid-template-columns:auto 1fr}
.none,.ctx{margin:.4rem 0 0;font:400 .78rem var(--font-ui);color:var(--muted)}
.ctx b{font:500 .78rem var(--font-num);color:var(--ink)}

.tip{position:fixed;z-index:50;pointer-events:none;background:var(--chip-on);color:var(--chip-on-ink);border-radius:.55rem;padding:.4rem .6rem;font:500 .78rem/1.5 var(--font-ui);box-shadow:var(--shadow);display:grid;gap:.1rem;max-width:16rem}

<body>
<header class="bar" id="bar">
  <div class="row top">
    <div class="brand">Sentiment<em>Marker</em></div>
    <div class="actions">
      <button class="btn solid" id="btnOpen" type="button">Open File</button>
      <button class="btn" id="btnPaste" type="button">Paste Text</button>
      <select class="btn" id="selDemo" title="Choose a demo article" aria-label="Demo articles"><option value="">Demo articles…</option></select>
    </div>
  </div>
  <div class="row ctl">
    <div class="seg" role="radiogroup" aria-label="Analysis granularity" id="seg">
      <button type="button" role="radio" aria-checked="false" data-level="word" title="Word (press 1)">Word</button>
      <button type="button" role="radio" aria-checked="true" data-level="sent" title="Sentence (press 2)">Sentence</button>
      <button type="button" role="radio" aria-checked="false" data-level="para" title="Paragraph (press 3)">Paragraph</button>
    </div>
    <button class="btn" id="btnSpec" type="button" aria-pressed="false" aria-controls="spec">Sentiment spectrum</button>
    <button class="btn" id="btnToc" type="button" aria-pressed="false" aria-controls="toc">Outline</button>
    <span class="legend" aria-hidden="true"><span>Negative</span><i class="ramp"></i><span>Positive</span></span>
    <label class="slider" for="th">Weak-signal filter<input id="th" type="range" min="0" max="0.9" step="0.01" value="0.15"><output id="thOut" for="th">15%</output></label>
    <button class="btn only-m" id="btnTopics" type="button" aria-expanded="false">Topics</button>
  </div>
  <div class="row topics" id="topics">
    <span class="lbl">Topics</span>
    <span id="chips" style="display:contents"></span>
    <input class="kw" id="kwInput" type="text" placeholder="Add a topic word" aria-label="Add a topic word" autocomplete="off">
    <span class="match" id="matchCount" aria-live="polite"></span>
  </div>
</header>

<main class="stage">
  <div class="sheet">
    <div class="dochead" id="dochead"></div>
    <article class="doc lv-sent" id="doc" aria-label="Document text"></article>
  </div>
</main>

<aside class="mm" id="mm" title="Sentiment heat bar for the whole article — click or drag to jump"><canvas id="mmCanvas"></canvas><div class="vp" id="vp"></div></aside>
<aside class="spec" id="spec" hidden aria-label="Sentiment spectrum"></aside>
<aside class="insp" id="insp" hidden></aside>
<aside class="toc" id="toc" hidden aria-label="Document outline"></aside>
<aside class="tpop" id="tpop" hidden aria-label="Topic summary"></aside>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="drop" id="drop" hidden><span>Drop to open PDF / Markdown / text / scored JSON·CSV</span></div>
<div class="paste" id="paste" hidden>
  <div class="pcard">
    <h2>Paste text, Markdown or scored results</h2>
    <textarea id="pasteText" placeholder="Paste an article, note or webpage text here; JSON / CSV scored results from an external model work too"></textarea>
    <div class="acts"><button class="btn" id="pasteCancel" type="button">Cancel</button><button class="btn solid" id="pasteGo" type="button">Analyze</button></div>
  </div>
</div>
<input type="file" id="file" accept=".pdf,.md,.markdown,.txt,.json,.csv,application/json,text/csv,application/pdf,text/plain,text/markdown" hidden>
<script src="examples/demos.js"></script>
<!-- input parsing + sentiment engine, shared with SentimentStoryDemo.html (window.SMCore) -->
<script src="sentiment-core.js"></script>

<script>
//<app>
/* ========== APP: rendering + interaction ========== */
const { buildDoc, extractTopics, makeTopic, matches, parseMarkdown, parseText, itemsToLines, linesToBlocks, docFromScored, docToJSON, docToCSV, csvToScored,
  buildSpec, rankText, noteText, scaleText, sectionScores, outlineWorthy, topicScores, sectionTopicScores, strength, NEUTRAL_K } = window.SMCore;
const SAMPLE_TITLE = 'Launch Week Retrospective';
const SAMPLE_MD = `## Monday: the launch
We shipped the new reader on Monday, and the first day went better than anyone expected. Early users loved the clean layout, and several told us it was the most pleasant product they had tried this year. The team was thrilled, although nobody had slept much.

## Wednesday: the bug
By Wednesday, the mood had changed. A serious bug corrupted saved highlights for about two hundred customers, and the support queue filled with angry messages. It was a painful mistake, and we are deeply sorry. The fix was slow because the failing code was fragile and poorly documented.

## Money
Funding was the other worry. Our runway looks uncertain after the market dropped, and two investors cancelled meetings. Still, one advisor was not discouraged and offered a generous introduction that could change the funding picture. We remain cautiously hopeful.

## Customers
The customers who stayed were remarkably kind. They reported the problem clearly, tested each patch, and never blamed the team. One wrote that the product was not perfect but already valuable, which meant a lot to everyone. That patience is a real strength we should protect.

## What comes next
Looking ahead, the plan is simple. We will repair the storage layer, write honest documentation, and improve onboarding so new users succeed faster. Growth matters less than trust right now. If we keep the product stable, the rest should follow.

Thanks to the whole team for an exhausting, difficult, and ultimately encouraging week. We lost sleep and some confidence, but we gained a better product and a stronger group.`;
const MAX_PAGES = 200;

const $ = s => document.querySelector(s);
const E = { bar: $('#bar'), head: $('#dochead'), doc: $('#doc'), th: $('#th'), thOut: $('#thOut'), chips: $('#chips'), topics: $('#topics'), mm: $('#mm'), mmc: $('#mmCanvas'), vp: $('#vp'), insp: $('#insp'), toc: $('#toc'), tpop: $('#tpop'), tip: $('#tip'), toast: $('#toast'), drop: $('#drop'), paste: $('#paste'), pasteText: $('#pasteText'), file: $('#file'), match: $('#matchCount'), kw: $('#kwInput'), seg: $('#seg'), btnTopics: $('#btnTopics'), spec: $('#spec'), btnSpec: $('#btnSpec'), btnToc: $('#btnToc') };
/* specWanted: the user's own open/close choice for the spectrum panel (null = untouched, follow the screen width) */
/* hits: ids of sentences matching the active topic words (document order); hitCur: index of the hit last
   navigated to (used to keep the place inside a selected paragraph); hitKey: hits as a string, to detect changes */
const S = { level: 'sent', pol: 'all', th: 0.15, doc: null, topics: [], sel: null, sample: false, name: '', avg: 0, badge: '', spec: undefined, specWanted: null, tocWanted: null, tocRows: [], tocClick: null, hits: [], hitCur: -1, hitKey: '', tstats: [], tpop: null };
const BADGE_TIP = { 'Sample': 'Built-in example text, scored by the simple in-browser dictionary', 'Built-in': 'Scored by the simple in-browser dictionary — demo only', 'External': 'Scores come from the JSON / CSV file you provided' };
const wideMQ = window.matchMedia('(min-width:1360px)');
let els = { w: [], s: [], b: [] }, pos = { s: [], b: [] }, visS = [], visB = [];
/* prefs in localStorage: theme, level, threshold, spectrum. Topics are not stored. */
const PREF_KEY = { theme: 'sm.theme', level: 'sm.level', th: 'sm.th', spec: 'sm.spec', toc: 'sm.toc' };
function prefGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function prefSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, String(v)); } catch (e) {} }
const THEME_CYCLE = ['system', 'light', 'dark'];
const THEME_LABEL = { system: 'System', light: 'Light', dark: 'Dark' };
function themeMode() {
  const a = document.documentElement.getAttribute('data-theme');
  return a === 'light' || a === 'dark' ? a : 'system';
}
function applyTheme(mode, persist) {
  const m = mode === 'light' || mode === 'dark' ? mode : 'system';
  if (m === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', m);
  if (E.btnTheme) {
    E.btnTheme.textContent = THEME_LABEL[m];
    E.btnTheme.setAttribute('aria-label', 'Theme: ' + THEME_LABEL[m]);
    E.btnTheme.title = 'Click to switch theme; current: ' + THEME_LABEL[m];
  }
  if (persist) prefSet(PREF_KEY.theme, m);
  drawMinimap();
}
function mountThemeButton() {
  const b = document.createElement('button');
  b.className = 'btn'; b.id = 'btnTheme'; b.type = 'button';
  E.bar.querySelector('.actions').appendChild(b);
  E.btnTheme = b;
  b.addEventListener('click', () => {
    const i = THEME_CYCLE.indexOf(themeMode());
    applyTheme(THEME_CYCLE[(i + 1) % THEME_CYCLE.length], true);
  });
}
function rememberSpec() {
  prefSet(PREF_KEY.spec, S.specWanted === null ? null : S.specWanted ? '1' : '0');
}
function rememberToc() {
  prefSet(PREF_KEY.toc, S.tocWanted === null ? null : S.tocWanted ? '1' : '0');
}
function restorePrefs() {
  const theme = prefGet(PREF_KEY.theme);
  applyTheme(theme === 'light' || theme === 'dark' ? theme : 'system', false);
  const lv = prefGet(PREF_KEY.level);
  if (lv === 'word' || lv === 'sent' || lv === 'para') S.level = lv;
  const raw = prefGet(PREF_KEY.th);
  const n = raw == null || raw === '' ? NaN : Number(raw);
  if (Number.isFinite(n)) {
    S.th = Math.min(0.9, Math.max(0, Math.round(n * 100) / 100));
    E.th.value = String(S.th);
    E.thOut.textContent = Math.round(S.th * 100) + '%';
  }
  const spec = prefGet(PREF_KEY.spec);
  if (spec === '1') S.specWanted = true;
  else if (spec === '0') S.specWanted = false;
  const toc = prefGet(PREF_KEY.toc);
  if (toc === '1') S.tocWanted = true;
  else if (toc === '0') S.tocWanted = false;
  syncSeg();
}

const fmt = (v, d = 2) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const sg = v => (v > 0 ? 'pos' : v < 0 ? 'neg' : '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clip = (t, n) => { const c = [...t]; return c.length > n ? c.slice(0, n).join('') + '…' : t; };   /* by code point: an emoji is never cut in half */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let toastTimer = 0, toastBusy = false;
/* busy = a progress message ("Reading page…") that loadFile may clear when it is done; other toasts are left alone */
function toast(msg, ms = 3200, busy = false) {
  clearTimeout(toastTimer); toastBusy = !!msg && busy;
  if (!msg) { E.toast.hidden = true; return; }
  E.toast.textContent = msg; E.toast.hidden = false;
  if (ms) toastTimer = setTimeout(() => { E.toast.hidden = true; }, ms);
}

function renderHead() {
  const D = S.doc, n = D.sents.length;
  let pos = 0, neg = 0, sum = 0;
  D.sents.forEach(s => { if (s.k >= NEUTRAL_K) { if (s.score > 0) pos++; else neg++; } sum += s.score; });
  const neu = n - pos - neg; S.avg = n ? sum / n : 0;
  const pct = v => Math.round(v / n * 100) + '%';
  const paras = D.blocks.filter(b => b.type === 'p').length;
  const extremes = [
    ...D.sents.filter(s => s.score > 0).sort((a, b) => b.score - a.score).slice(0, 3),
    ...D.sents.filter(s => s.score < 0).sort((a, b) => a.score - b.score).slice(0, 3)
  ];
  const pills = extremes.map(s => {
    const chars = [...s.text], preview = chars.length > 36 ? chars.slice(0, 36).join('') + '…' : s.text;
    return `<button type="button" class="chip ${sg(s.score)}" data-sent="${s.id}" title="${esc(s.text)}" style="max-width:100%">${fmt(s.score)} · <span style="overflow:hidden;text-overflow:ellipsis;min-width:0">${esc(preview)}</span></button>`;
  }).join('');
  E.head.innerHTML = `<p class="src"><span class="fn">${esc(S.name)}</span><span class="badge" title="${esc(BADGE_TIP[S.badge] || '')}">${esc(S.badge)}</span><span class="exp"><button class="lnk" type="button" data-exp="json">Export JSON</button><button class="lnk" type="button" data-exp="csv">Export CSV</button></span></p>
    <h1>${esc(D.title)}</h1>
    <p class="meta">${paras} paragraphs · ${n} sentences · ${D.words.length} sentiment words · article mean ${fmt(S.avg)}</p>
    <div class="dist" role="img" aria-label="negative ${pct(neg)}, neutral ${pct(neu)}, positive ${pct(pos)}"><i class="neg" style="flex:${neg}"></i><i class="neu" style="flex:${neu}"></i><i class="pos" style="flex:${pos}"></i></div>
    <p class="dlg"><span>Negative ${pct(neg)}</span><span>Neutral ${pct(neu)}</span><span>Positive ${pct(pos)}</span></p>
    ${pills ? `<div style="display:flex;flex-wrap:wrap;gap:.4rem;margin:.7rem 0" aria-label="Most positive and negative sentences">${pills}</div>` : ''}
    <p class="scl" title="The colour is deepest once |score| reaches this value">${scaleText(D)}</p>
    ${D.mixedSent ? '<p class="scl">Note: some sentence scores come from the file and some are derived from word scores (S / √(S² + 15)) — they may not sit on the same scale.</p>' : ''}`;
}
function renderDoc() {
  const out = [];
  S.doc.blocks.forEach(b => {
    const tag = b.type === 'h' ? 'h2' : 'p';
    out.push(`<${tag} class="blk${b.type === 'h' ? ' hd' : ''} ${sg(b.score)}" data-b="${b.id}" style="--k:${b.k.toFixed(3)}">`);
    for (const s of b.sents) {
      out.push(`<span class="s ${sg(s.score)}" data-s="${s.id}" style="--k:${s.k.toFixed(3)}">`);
      for (const t of s.toks) {
        if (t.score) out.push(`<span class="w ${sg(t.score)}" data-w="${t.wid}" style="--k:${t.k.toFixed(3)}">${esc(t.text)}</span>`);
        else out.push(esc(t.text));
      }
      out.push('</span>' + esc(s.gap));
    }
    out.push(`</${tag}>`);
  });
  E.doc.innerHTML = out.join('');
  els = { w: [...E.doc.querySelectorAll('.w')], s: [...E.doc.querySelectorAll('.s')], b: [...E.doc.querySelectorAll('.blk')] };
}

/* an item (word / sentence / block) is highlighted when it passes the weak-signal threshold and polarity filter */
const polMatch = it => S.pol === 'all' || (S.pol === 'pos' ? it.score > 0 : it.score < 0);
const isOn = it => it.k > 0 && it.k >= S.th && polMatch(it);
function refresh() {
  E.doc.className = 'doc lv-' + S.level;
  const [E_, D_] = S.level === 'word' ? [els.w, S.doc.words] : S.level === 'sent' ? [els.s, S.doc.sents] : [els.b, S.doc.blocks];
  for (let i = 0; i < E_.length; i++) E_[i].classList.toggle('on', isOn(D_[i]));
  applyTopics();
}
function applyTopics() {
  const act = S.topics.filter(t => t.on), hitIds = [];
  visS = []; visB = [];
  S.doc.blocks.forEach((b, bi) => {
    const flags = b.sents.map(s => act.some(t => matches(s, t)));
    const any = flags.some(Boolean), be = els.b[bi];
    visB[bi] = !act.length || any;
    be.classList.toggle('blkdim', !!act.length && !any);
    b.sents.forEach((s, i) => {
      const vis = !act.length || flags[i];
      visS[s.id] = vis && (!act.length || any);
      els.s[s.id].classList.toggle('dim', !!act.length && any && !flags[i]);
      if (act.length && flags[i]) hitIds.push(s.id);
    });
  });
  const hadHits = S.hits.length > 0, key = hitIds.join(',');
  if (key !== S.hitKey) { S.hits = hitIds; S.hitKey = key; S.hitCur = -1; }
  updateMatch();
  const nOn = act.length;
  E.btnTopics.textContent = nOn ? `Topics · ${nOn}` : 'Topics';
  drawMinimap();
  /* matches went from none to some: show the first one, but only if nothing is selected and it is off screen */
  if (!hadHits && S.hits.length && !S.sel && !inView(els.s[S.hits[0]])) gotoHit(0);
}
/* any part of the element is on screen below the sticky toolbar */
function inView(el) {
  if (!el) return false;
  const r = el.getBoundingClientRect();
  return r.bottom > E.bar.getBoundingClientRect().bottom && r.top < window.innerHeight;
}
function syncSeg() {
  const tips = { word: 'Word (press 1)', sent: 'Sentence (press 2)', para: 'Paragraph (press 3)' };
  E.seg.querySelectorAll('button').forEach(b => {
    const ok = !S.doc || S.doc.has[b.dataset.level];
    b.disabled = !ok;
    b.title = ok ? tips[b.dataset.level] : 'This file has no scores at that level';
    b.setAttribute('aria-checked', String(b.dataset.level === S.level));
  });
}
function setLevel(l, persist = true) {
  if (l !== 'word' && l !== 'sent' && l !== 'para') return;
  if (S.doc && !S.doc.has[l]) return;
  S.level = l; syncSeg(); closeInsp(); refresh();
  if (persist) prefSet(PREF_KEY.level, l);   /* only user-driven switches persist; jumpWord's auto-switch must not rewrite the remembered level */
}

const segPol = document.createElement('div');
segPol.className = 'seg';
segPol.id = 'segPol';
segPol.setAttribute('role', 'radiogroup');
segPol.setAttribute('aria-label', 'Polarity filter');
segPol.innerHTML = `
  <button type="button" role="radio" aria-checked="true" data-pol="all" title="Show all">All</button>
  <button type="button" role="radio" aria-checked="false" data-pol="neg" title="Negative only">Neg</button>
  <button type="button" role="radio" aria-checked="false" data-pol="pos" title="Positive only">Pos</button>
`;
E.seg.after(segPol);

function syncSegPol() {
  segPol.querySelectorAll('button').forEach(b => {
    const act = b.dataset.pol === S.pol;
    b.setAttribute('aria-checked', String(act));
  });
}
function setPol(p) {
  if (p === S.pol) return;
  S.pol = p;
  syncSegPol();
  refresh();
}
segPol.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && b.dataset.pol) setPol(b.dataset.pol);
});

/* topic chips: count, then the topic's mean sentence score (topicScores: sentence-level, overlaps count toward each topic) */
const topicLv = () => (S.doc.has.sent ? 'sent' : 'para');   /* the colour scale a topic mean is read on (paragraph-only files: paragraphs) */
function renderChips() {
  const anyOn = S.topics.some(t => t.on);
  S.tstats = topicScores(S.doc, S.topics);
  E.chips.innerHTML = S.topics.map((t, i) => {
    const st = S.tstats[i], k = strength(topicLv(), st.mean, S.doc.cap).toFixed(3);
    const tip = st.count ? `${st.count} sentence${st.count === 1 ? '' : 's'} mention “${t.label}” · mean ${fmt(st.mean)}` : `No sentence mentions “${t.label}”`;
    return `<span class="tg"><button type="button" class="chip" data-i="${i}" aria-pressed="${t.on}" title="${esc(tip)}">${esc(t.label)} <small>${t.count}</small>`
      + `<span class="tmean ${sg(st.mean)}" style="--k:${k}" aria-label="mean ${fmt(st.mean)}"><i></i>${fmt(st.mean)}</span>${t.custom ? '<span class="rm" data-rm="' + i + '" aria-label="Remove">×</span>' : ''}</button>`
      + `<button type="button" class="chip more" data-more="${i}" aria-controls="tpop" aria-expanded="${S.tpop === t}" aria-label="Strongest passages about ${esc(t.label)}" title="Strongest passages">▾</button></span>`;
  }).join('') + (anyOn ? '<button type="button" class="chip" data-clear="1">Clear</button>' : '');
  if (S.tpop) renderTpop();
}
E.chips.addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more) { const t = S.topics[+more.dataset.more]; if (S.tpop === t) closeTpop(); else { S.tpop = t; renderChips(); } return; }
  if (e.target.closest('[data-clear]')) { S.topics.forEach(t => t.on = false); }
  else if (e.target.dataset.rm) { if (S.topics.splice(+e.target.dataset.rm, 1)[0] === S.tpop) closeTpop(); }
  else { const c = e.target.closest('.chip'); if (!c) return; const t = S.topics[+c.dataset.i]; t.on = !t.on; }
  renderChips(); applyTopics(); paintToc();
});
E.kw.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = makeTopic(E.kw.value, S.doc); if (!t) return;
  if (!t.count) { toast(`No occurrences of "${t.label}" in the article`); return; }
  S.topics.push(t); E.kw.value = ''; renderChips(); applyTopics(); paintToc();
});
/* topic popover: one topic's summary and its strongest positive / negative passages; a passage jumps like a match does */
function renderTpop() {
  const t = S.tpop, i = S.topics.indexOf(t), st = S.tstats[i];
  if (!t || i < 0 || !st) { closeTpop(); return; }
  const n = st.count;

  const sp = getSpec();
  const head = '<div class="ih"><span class="ik">Sentiment spectrum</span><button class="x" type="button" data-spec-close aria-label="Close">×</button></div>';
  if (!sp) { E.spec.innerHTML = head + '<p class="none">No scored words in this file — nothing to chart.</p>'; return; }
  const sub = sp.own ? 'This file ships no reference vocabulary; only the distribution and ranks of the article itself are shown.'
    : `The x-axis is word sentiment scores. Grey = the distribution of all ${sp.refN} words in ${esc(sp.refName)}; colour = the sentiment words this article uses; the line = the article mean; ▲ = the words in the sentence you clicked.`;
  let sum = `This article has ${sp.docN} sentiment words: ${sp.nPos} positive, ${sp.nNeg} negative. Mean <b>${fmt(sp.mean)}</b>`;
  if (!sp.own) { const d = sp.mean - sp.refMean, v = d > sp.M * 0.1 ? 'overall more positive than the reference vocabulary' : d < -sp.M * 0.1 ? 'overall more negative than the reference vocabulary' : 'overall about the same as the reference vocabulary'; sum += `, reference mean <b>${fmt(sp.refMean)}</b> — ${v}.`; } else sum += '.';
  const row = it => `<li data-wid="${it.wid}" class="${sg(it.score)}"><span class="wt">${esc(it.text)}${it.n > 1 ? ` <small>×${it.n}</small>` : ''}</span><span class="sc">${fmt(it.score, 1)}</span><span class="rk">${rankText(it, sp.own)}</span></li>`;
  const list = (title, arr) => arr.length ? `<h3>${title}</h3><ul class="wl">${arr.map(row).join('')}</ul>` : '';
  const an = (arr) => arr.map(a => `<span class="an ${sg(a.score)}"><span>${esc(a.text)}</span><span class="sc">${fmt(a.score, 1)}</span></span>`).join('');
  const anNeg = sp.anchors.filter(a => a.score < 0).sort((a, b) => a.score - b.score), anPos = sp.anchors.filter(a => a.score > 0).sort((a, b) => b.score - a.score);
  const sw = sp.scaleWarn ? `<p class="warnl">The largest |word score| in this article is ${sp.docMax.toFixed(2)}, in the reference ${sp.refMax.toFixed(2)} — a ${sp.scaleRatio > 1 ? sp.scaleRatio.toFixed(1) : (1 / sp.scaleRatio).toFixed(1)}× gap. The two may not share the same ruler, so treat percentiles as indicative.</p>` : '';
  E.spec.innerHTML = head + `<p class="sub">${sub}</p>${sw}<div id="specChart">${specChart(sp, specMarks())}</div><p class="sumline">${sum}</p>`
    + list('Most positive words in this article', sp.pos) + list('Most negative words in this article', sp.neg)
    + (sp.anchors.length ? `<h3>Scale anchors</h3><p class="sub" style="margin:0 0 .5rem">Scores of these words in the reference vocabulary, to pin numbers onto real words.</p><div class="anch"><div>${an(anNeg)}</div><div>${an(anPos)}</div></div>` : '');
}

/* ---------- outline: rows come from sectionScores; the bar colour squashes the raw sum back into sentence range ---------- */
function renderToc() {
  if (!S.doc) { E.toc.innerHTML = ''; return; }
  S.tocClick = null;
  S.tocRows = sectionScores(S.doc);

}
/* rows from S.tocRows. With topics selected, each row shows instead the sentences of that section that mention
   them (sectionTopicScores: the same union the filter leaves undimmed) and their mean; rows without one fade */
function paintToc() {
  if (!S.doc) return;
  const rows = S.tocRows;
  if (!rows.length) { E.toc.innerHTML = '<p class="none">This document has no headings.</p>'; return; }
  const act = S.topics.filter(t => t.on), tr = act.length ? sectionTopicScores(S.doc, act) : null, names = act.map(t => t.label).join(' / ');
  E.toc.innerHTML = `<h3>Outline${tr ? ' · ' + esc(names) : ''}</h3>${tr ? '<p class="tnote">Per section: sentences that mention the selected topic × their mean score</p>' : ''}<ol>${rows.map((r, i) => {
    if (tr) {
      const x = tr[i], w = x.count ? Math.max(4, Math.round(strength(topicLv(), x.mean, S.doc.cap) * 100)) : 0;
      return `<li class="lv${r.level}${x.count ? '' : ' off'}" style="--hue:var(--${x.mean > 0 ? 'pos' : x.mean < 0 ? 'neg' : 'muted'})">` +
        `<button class="te" type="button" data-goto="${r.blockId}" title="${esc(r.text)} · ${x.count} of ${r.count} sentences mention ${esc(names)}${x.count ? ' · mean ' + fmt(x.mean) : ''}">` +
        `<span class="tt">${esc(r.text)}</span><span class="tv">${x.count ? `<small>${x.count}×</small> ${fmt(x.mean)}` : '—'}</span>` +
        `<i class="tb${x.mean < 0 ? ' n' : ''}" style="width:${w}%"></i></button></li>`;
    }
    const q = r.score / Math.sqrt(r.score * r.score + 15);   /* same squash as derived sentence scores, so bars across documents compare */
    const w = Math.max(4, Math.round(Math.abs(q) * 100));
    return `<li class="lv${r.level}" style="--hue:var(--${q > 0 ? 'pos' : q < 0 ? 'neg' : 'muted'})">` +
      `<button class="te" type="button" data-goto="${r.blockId}" title="${esc(r.text)} · ${r.count} sentences · sum ${fmt(r.score, 1)}">` +
      `<span class="tt">${esc(r.text)}</span><span class="tv">${fmt(r.score, 1)}</span>` +
      `<i class="tb${q < 0 ? ' n' : ''}" style="width:${w}%"></i></button></li>`;
  }).join('')}</ol>`;
  updateTocActive();
}
/* the active row = the last heading whose top is at or above the reading line (the line sits below
   scroll-margin-top so a clicked heading counts as reached); a row the user just clicked stays active
   until real user input (wheel / touch / key) or a document switch */
function updateTocActive() {
  if (E.toc.hidden || !S.tocRows.length) return;
  const y = window.scrollY + E.bar.offsetHeight + 24;
  let act = -1;
  for (const r of S.tocRows) { const p = pos.b[r.blockId]; if (p && p.top <= y) act = r.blockId; else break; }
  if (S.tocClick != null) {
    const p = pos.b[S.tocClick];
    if (p && Math.abs(p.top - window.scrollY) < window.innerHeight) act = S.tocClick;   /* out of range: ignored this frame (mid-smooth-scroll), cleared by user input or a document switch */
  }
  if (act < 0) act = S.tocRows[0].blockId;
  E.toc.querySelectorAll('.te').forEach(b => b.classList.toggle('on', +b.dataset.goto === act));
}

window.addEventListener('touchmove', () => { S.tocClick = null; }, { passive: true });

E.insp.addEventListener('click', async e => {
  if (e.target.closest('[data-close]')) { closeInsp(); return; }
  if (e.target.closest('[data-copy-quote]') && S.sel) {

    const item = kind === 'b' ? S.doc.blocks[id] : S.doc.sents[id];
    const body = kind === 'b' ? item.sents.map(s => s.text + s.gap).join('').trimEnd() : item.text;
    const quoted = body.replace(/\r\n?/g, '\n').split('\n').map(line => `> ${line}`).join('\n');
    const label = item.score > 0 ? 'positive' : item.score < 0 ? 'negative' : 'neutral';
    try {
      await navigator.clipboard.writeText(`${quoted}\n—— Sentiment: ${fmt(item.score)}(${label})`);
      toast('Quote copied');

/* hover tip (mouse only) */
let tipRAF = 0;
function showTip(e) {
  const t = e.target; if (!t.closest) return;
  const wEl = t.closest('.w'), sEl = t.closest('.s'), bEl = t.closest('.blk'), rows = [];
  if (S.level === 'para' && bEl) { const b = S.doc.blocks[+bEl.dataset.b]; rows.push(`<span class="${sg(b.score)}"><i class="dot"></i>Paragraph <b>${fmt(b.score)}</b></span>`); }
  if (S.level === 'sent' && sEl) { const s = S.doc.sents[+sEl.dataset.s]; rows.push(`<span class="${sg(s.score)}"><i class="dot"></i>Sentence <b>${fmt(s.score)}</b></span>`); }
  if (S.level !== 'para' && wEl) { const w = S.doc.words[+wEl.dataset.w]; rows.push(`<span class="${sg(w.score)}"><i class="dot"></i>Word <b>${esc(w.text)} ${fmt(w.score, 1)}</b></span>`); if (w.notes.length) rows.push(`<span class="m">${esc(noteText(w))}</span>`); }
  if (!rows.length) { E.tip.hidden = true; return; }
  E.tip.innerHTML = rows.join(''); E.tip.hidden = false;
  const r = E.tip.getBoundingClientRect();
  E.tip.style.left = Math.min(window.innerWidth - r.width - 8, e.clientX + 14) + 'px';
  E.tip.style.top = Math.min(window.innerHeight - r.height - 8, e.clientY + 18) + 'px';
}
E.doc.addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; cancelAnimationFrame(tipRAF); tipRAF = requestAnimationFrame(() => showTip(e)); });
E.doc.addEventListener('pointerleave', () => { E.tip.hidden = true; });

/* loading documents */
function openDoc(title, blocks, meta) {
  const doc = meta.scored ? docFromScored(meta.scored) : buildDoc(title, blocks);
  if (!doc.sents.length) throw new Error('No text found to analyse');
  S.doc = doc; S.sample = !!meta.sample; S.name = meta.name || doc.title; S.badge = meta.badge || (meta.sample ? 'Sample' : 'Built-in');
  closeTpop();
  S.topics = extractTopics(doc, 8); S.sel = null; S.spec = undefined; S.hits = []; S.hitKey = ''; S.hitCur = -1;
  if (!doc.has[S.level]) S.level = doc.has.sent ? 'sent' : doc.has.para ? 'para' : 'word';
  syncSeg();
  E.spec.innerHTML = '';
  renderHead(); renderDoc(); renderChips(); refresh();
  renderToc();
  syncPanels();
  window.scrollTo(0, 0);
  requestAnimationFrame(() => { layout(); drawMinimap(); });
  const w = doc.warn, parts = [];
  if (w) {
    if (w.misaligned) parts.push(`${w.misaligned} word offsets did not match the text and were relocated by content`);
    if (w.unmatched) parts.push(`skipped ${w.unmatched} words not found inside their sentences`);
    if (w.bad) parts.push(`skipped ${w.bad} invalid rows/entries`);
    if (w.skipped) parts.push(`skipped ${w.skipped} paragraphs without text`);
  }
  const msg = parts.join('；');
  if (msg) toast(msg, 8000);
  return msg;
}
function openScoredText(text, kind, name) {
  let obj;
  if (kind === 'json') { try { obj = JSON.parse(text); } catch (e) { throw new Error('JSON parse failed: ' + e.message); } }
  else obj = csvToScored(text);
  if (obj && typeof obj === 'object' && !obj.title) obj.title = name.replace(/\.[^.]+$/, '').replace(/\.scored$/, '');
  return openDoc(null, null, { name, scored: obj, badge: 'External' });
}
function exportDoc(kind) {
  if (!S.doc) return;
  const base = (S.doc.title || 'sentimentmarker').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '-').toLowerCase();
  const name = `${base}.scored.${kind}`;
  const text = kind === 'json' ? JSON.stringify(docToJSON(S.doc), null, 1) : '\ufeff' + docToCSV(S.doc);
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: kind === 'json' ? 'application/json' : 'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast(`Started downloading ${name}; if no file shows up, this page may block downloads — open index.html locally to export`, 6000);
    return;
  } catch (e) { /* the download could not even be started (some embedded viewers): fall back to the clipboard */ }
  const small = text.length < 1.5e6;
  (small && navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
    () => toast(`Downloads are blocked; the content of ${name} was copied to the clipboard — paste it into a new file to save`, 7000),
    () => toast(`Downloads are blocked and the clipboard failed too; open index.html locally to export`, 7000));
}
async function readPDF(file) {
  if (!window.pdfjsLib) throw new Error('The PDF engine failed to load — check your connection and refresh');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const n = Math.min(pdf.numPages, MAX_PAGES), pages = [];
  for (let i = 1; i <= n; i++) {
    toast(`Reading page ${i} / ${n}…`, 0, true);
    const page = await pdf.getPage(i), tc = await page.getTextContent(), vp = page.getViewport({ scale: 1 });
    pages.push({ height: vp.height, lines: itemsToLines(tc.items) });
  }
  const note = pdf.numPages > n ? `Only the first ${n} of ${pdf.numPages} pages were read to keep the page responsive` : '';
  pdf.destroy();
  const blocks = linesToBlocks(pages);
  if (blocks.reduce((a, b) => a + b.text.length, 0) < 40) throw new Error('No readable text found in this PDF — it may be a scan; v1 does not do OCR.');
  return { blocks, note };
}
async function loadFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  try {
    toast(`Reading ${file.name}…`, 0, true);
    let warnMsg = '', note = '';
    if (ext === 'json' || ext === 'csv') warnMsg = openScoredText(await file.text(), ext, file.name);
    else {
      let blocks;
      if (ext === 'pdf' || file.type === 'application/pdf') ({ blocks, note } = await readPDF(file));
      else { const t = await file.text(); blocks = (ext === 'md' || ext === 'markdown') ? parseMarkdown(t) : parseText(t); }
      warnMsg = openDoc(file.name.replace(/\.[^.]+$/, ''), blocks, { name: file.name });
    }
    if (note) toast(warnMsg ? note + '；' + warnMsg : note, 8000);   /* keep the truncation notice; never cleared by the progress check */
    else if (toastBusy) toast('');
  } catch (err) { toast('Could not open: ' + (err && err.message ? err.message : err), 6000); }
}
/* article picker. Small demos are inline on window.DEMOS. The full review is a classic
   script (d.src) assigned onto window.DEMO_FILES, inserted the first time it is opened.
   fetch() is not used: file:// blocks it. loadDemo(0) stays synchronous. */
const demoScriptLoads = {};
let demoOpenGen = 0;
function loadDemo(i) {
  const d = (window.DEMOS || [])[i];
  if (!d) return false;
  const gen = ++demoOpenGen;
  const current = () => gen === demoOpenGen;
  const open = scored => {
    if (!current()) return '';
    return openDoc(null, null, { name: d.file, scored, badge: 'External' });
  };
  const fail = err => {
    if (!current()) return false;
    const sel = $('#selDemo');
    if (sel && sel.value === String(i)) sel.value = '';
    toast('Could not open the demo article: ' + (err && err.message ? err.message : err), 6000);
    return false;
  };
  const cached = d.scored || (window.DEMO_FILES && window.DEMO_FILES[d.file]);
  if (cached) {
    try { const msg = open(cached); if (!msg && toastBusy) toast(''); return true; }
    catch (err) { return fail(err); }
  }
  if (!d.src) return fail(new Error('missing scores'));
  toast('Opening the full review…', 0, true);
  if (!demoScriptLoads[d.src]) {
    const load = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = d.src;
      s.onload = () => {
        const obj = window.DEMO_FILES && window.DEMO_FILES[d.file];
        if (obj) resolve(obj); else reject(new Error('demo script did not publish ' + d.file));
      };
      s.onerror = () => reject(new Error('could not load ' + d.src));
      document.head.appendChild(s);
    });
    /* A rejected load must not stick: the next choice inserts the script again. */
    demoScriptLoads[d.src] = load;
    load.catch(() => { if (demoScriptLoads[d.src] === load) delete demoScriptLoads[d.src]; });
  }
  demoScriptLoads[d.src].then(scored => {
    const msg = open(scored);
    if (current() && !msg && toastBusy) toast('');
  }).catch(fail);
  return true;
}
function initDemoSel() {
  const sel = $('#selDemo'), list = window.DEMOS || [];
  list.forEach((d, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = d.label; sel.appendChild(o); });
  if (!list.length) { const o = document.createElement('option'); o.value = ''; o.textContent = 'Missing examples/demos.js'; o.disabled = true; sel.appendChild(o); return; }
  /* blur afterwards: a focused <select> is excluded from the reading shortcuts (1/2/3, j/k) */
  sel.addEventListener('change', () => { if (sel.value !== '') loadDemo(+sel.value); sel.blur(); });
  if (loadDemo(0)) sel.value = '0';
}

    else if (!wideMQ.matches && !E.toc.hidden) { S.tocWanted = false; rememberToc(); panelFront = 'spec'; syncPanels(); }   /* hand the front back like the button's close path, or every sheet stays hidden */
